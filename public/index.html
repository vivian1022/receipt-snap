<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Receipt Snap</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1c1e21; --muted: #65676b;
    --accent: #2563eb; --accent-soft: #dbeafe; --border: #e4e6eb;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px; margin: 0 auto; padding-bottom: 90px;
  }
  header {
    position: sticky; top: 0; background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; }
  #month-nav { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
  #month-nav button {
    background: none; border: none; font-size: 20px; color: var(--accent); cursor: pointer; padding: 4px 8px;
  }
  main { padding: 16px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-bottom: 16px;
  }
  .total-label { color: var(--muted); font-size: 13px; }
  .total-amount { font-size: 30px; font-weight: 700; margin-top: 2px; }
  .cat-row { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 13px; }
  .cat-bar { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .cat-bar > div { height: 100%; background: var(--accent); }
  .cat-name { width: 100px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cat-amt { width: 70px; text-align: right; font-weight: 600; }
  #drop {
    border: 2px dashed var(--border); border-radius: 14px; padding: 28px 16px;
    text-align: center; color: var(--muted); cursor: pointer; transition: border-color .2s;
  }
  #drop.dragover { border-color: var(--accent); }
  .expense {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid var(--border);
  }
  .expense:last-child { border-bottom: none; }
  .expense .info { flex: 1; min-width: 0; }
  .expense .merchant { font-weight: 600; font-size: 15px; }
  .expense .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .expense .amt { font-weight: 700; font-size: 15px; }
  .del {
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 16px; padding: 4px 6px;
  }
  .del:hover { color: var(--danger); }
  #fab-bar {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--card); border-top: 1px solid var(--border);
  }
  #snap-btn {
    width: 100%; padding: 14px; border: none; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 16px; font-weight: 600; cursor: pointer;
  }
  #snap-btn:disabled { opacity: .6; }
  .hidden { display: none !important; }
  #preview img { width: 100%; border-radius: 12px; margin-bottom: 12px; }
  #status { text-align: center; color: var(--muted); margin-bottom: 12px; }
  .spinner {
    display: inline-block; width: 18px; height: 18px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: middle; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #toast {
    position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
    background: #1c1e21; color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50;
  }
  #toast.show { opacity: 1; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 15px; background: var(--bg); color: var(--text);
  }
  .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin: 20px 0 8px; }
</style>
</head>
<body>
<header>
  <h1>🧾 Receipt Snap</h1>
  <div id="month-nav">
    <button id="prev-month" aria-label="Previous month">‹</button>
    <span id="month-label"></span>
    <button id="next-month" aria-label="Next month">›</button>
  </div>
</header>

<main>
  <div class="card">
    <div class="total-label">Total this month</div>
    <div class="total-amount" id="total">$0.00</div>
    <div id="by-category"></div>
  </div>

  <div id="capture-section">
    <div class="section-title">New expense</div>
    <div class="card">
      <div id="drop">
        <div style="font-size:32px">📷</div>
        <div>Tap to snap or upload a receipt — AI fills it in</div>
      </div>
      <input type="file" id="file-input" accept="image/*" capture="environment" class="hidden">
      <div id="manual-toggle" style="text-align:center;color:var(--accent);font-size:14px;margin-top:12px;cursor:pointer;font-weight:600;">＋ Or add manually</div>
    </div>
    <div class="card hidden" id="manual-card">
      <div class="field"><label>Merchant</label><input id="m-merchant" placeholder="e.g. Coffee Shop"></div>
      <div class="field"><label>Amount</label><input id="m-amount" type="number" step="0.01" min="0.01" placeholder="0.00" inputmode="decimal"></div>
      <div class="field"><label>Date</label><input id="m-date" type="date"></div>
      <div class="field"><label>Category</label>
        <select id="m-category">
          <option>Groceries</option><option>Dining</option><option>Transport</option>
          <option>Shopping</option><option>Bills</option><option>Health</option>
          <option>Entertainment</option><option>Other</option>
        </select>
      </div>
      <button id="manual-save" style="width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;">Save expense</button>
    </div>
  </div>

  <div class="card hidden" id="preview">
    <img id="preview-img" alt="Receipt preview">
    <div id="status"></div>
    <button id="cancel-btn" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:none;cursor:pointer;">Cancel</button>
  </div>

  <div class="section-title">Expenses</div>
  <div class="card" id="expense-list"></div>
</main>

<div id="fab-bar"><button id="snap-btn">📷 Snap a receipt</button></div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const state = { month: new Date().toISOString().slice(0, 7) };

const fmt = (n) => '$' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const monthLabel = (ym) =>
  new Date(ym + '-02').toLocaleString('en-US', { month: 'long', year: 'numeric' });

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function shiftMonth(delta) {
  const [y, m] = state.month.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 1 + delta, 1));
  state.month = d.toISOString().slice(0, 7);
  loadMonth();
}

async function loadMonth() {
  $('month-label').textContent = monthLabel(state.month);
  const res = await fetch(`/api/expenses?month=${state.month}`);
  const data = await res.json();

  $('total').textContent = fmt(data.total || 0);

  const cats = Object.entries(data.byCategory || {}).sort((a, b) => b[1] - a[1]);
  const max = Math.max(...cats.map(c => c[1]), 1);
  $('by-category').innerHTML = cats.map(([name, amt]) => `
    <div class="cat-row">
      <span class="cat-name">${name}</span>
      <div class="cat-bar"><div style="width:${(amt / max) * 100}%"></div></div>
      <span class="cat-amt">${fmt(amt)}</span>
    </div>`).join('');

  const list = data.expenses || [];
  $('expense-list').innerHTML = list.length
    ? list.map(e => `
      <div class="expense">
        <div class="info">
          <div class="merchant">${escapeHtml(e.merchant)}</div>
          <div class="meta">${e.spent_at} · ${e.category}</div>
        </div>
        <span class="amt">${fmt(e.amount)}</span>
        <button class="del" data-id="${e.id}" aria-label="Delete">✕</button>
      </div>`).join('')
    : '<div class="empty">No expenses yet this month.</div>';

  for (const btn of document.querySelectorAll('.del')) {
    btn.onclick = async () => {
      await fetch(`/api/expenses/${btn.dataset.id}`, { method: 'DELETE' });
      loadMonth();
      toast('Deleted');
    };
  }
}

const escapeHtml = (s) => s.replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function startProcessing(file) {
  $('capture-section').classList.add('hidden');
  $('preview').classList.remove('hidden');
  $('preview-img').src = URL.createObjectURL(file);
  $('status').innerHTML = '<span class="spinner"></span>Reading receipt with AI…';

  const form = new FormData();
  form.append('receipt', file);
  fetch('/api/receipts', { method: 'POST', body: form })
    .then(async (res) => {
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Failed to read receipt.');
      cancelPreview();
      state.month = data.spent_at.slice(0, 7); // jump to the receipt's month
      await loadMonth();
      toast(`Added: ${data.merchant} · ${fmt(data.amount)} · ${data.category}`);
    })
    .catch((err) => {
      $('status').textContent = '⚠️ ' + err.message;
    });
}

function cancelPreview() {
  $('preview').classList.add('hidden');
  $('capture-section').classList.remove('hidden');
  $('file-input').value = '';
}

$('file-input').addEventListener('change', (e) => {
  if (e.target.files[0]) startProcessing(e.target.files[0]);
});
$('drop').addEventListener('click', () => $('file-input').click());
$('drop').addEventListener('dragover', (e) => { e.preventDefault(); $('drop').classList.add('dragover'); });
$('drop').addEventListener('dragleave', () => $('drop').classList.remove('dragover'));
$('drop').addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer.files[0]) startProcessing(e.dataTransfer.files[0]);
});
$('snap-btn').addEventListener('click', () => $('file-input').click());
$('cancel-btn').addEventListener('click', cancelPreview);
$('prev-month').addEventListener('click', () => shiftMonth(-1));
$('next-month').addEventListener('click', () => shiftMonth(1));

// Manual entry
$('manual-toggle').addEventListener('click', () => {
  const card = $('manual-card');
  card.classList.toggle('hidden');
  if (!card.classList.contains('hidden')) {
    $('m-date').value = state.month + '-' + String(new Date().getDate()).padStart(2, '0');
    $('m-merchant').focus();
  }
});
$('manual-save').addEventListener('click', async () => {
  const body = {
    merchant: $('m-merchant').value.trim(),
    amount: parseFloat($('m-amount').value),
    date: $('m-date').value,
    category: $('m-category').value,
  };
  if (!body.merchant || !Number.isFinite(body.amount) || body.amount <= 0) {
    toast('⚠️ Merchant and amount are required');
    return;
  }
  const res = await fetch('/api/expenses', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) { toast('⚠️ Failed to save'); return; }
  const saved = await res.json();
  $('m-merchant').value = ''; $('m-amount').value = '';
  $('manual-card').classList.add('hidden');
  state.month = saved.spent_at.slice(0, 7);
  await loadMonth();
  toast(`Added: ${saved.merchant} · ${fmt(saved.amount)} · ${saved.category}`);
});

loadMonth();
</script>
</body>
</html>
